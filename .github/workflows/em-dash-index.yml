name: Update the Em Dash Index

# Looks for new AI model launch posts once a day, counts their em dashes, and commits
# the result. GitHub Pages rebuilds from the commit.
on:
  schedule:
    - cron: "17 14 * * *" # 14:17 UTC daily
  workflow_dispatch:
    inputs:
      args:
        description: "Extra flags for update.mjs (--recount, --retry, --lab=OpenAI)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: em-dash-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Count em dashes
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: node scripts/em-dash-index/update.mjs $ARGS

      - name: Redraw the link preview card
        # Only when the numbers on it changed. A failure here shouldn't block the data.
        continue-on-error: true
        run: |
          if git diff --quiet -- og/em-dash-index.html; then exit 0; fi
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1200,630 --force-device-scale-factor=2 --virtual-time-budget=8000 \
            --screenshot="$PWD/og/em-dash-index.png" "file://$PWD/og/em-dash-index.html"

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A em-dash-index og scripts/em-dash-index index.html
          git commit -m "Update the Em Dash Index"
          git push
