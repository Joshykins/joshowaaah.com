<!doctype html>
<!-- Source for og/home.png (the link preview card). Render at 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Joshowaaah preview card</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden; position: relative;
  background-color: #0d0d0c;
  background-image: radial-gradient(circle at 1px 1px, #222220 1.5px, transparent 0);
  background-size: 30px 30px;
  color: #f0efec; font-family: "JetBrains Mono", monospace; -webkit-font-smoothing: antialiased;
  padding: 46px 64px 0;
}
.top { display: flex; justify-content: space-between; align-items: center; font: 500 19px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #85847c; }
.top b { color: #e8622c; font-weight: 500; letter-spacing: 0; margin-right: 10px; }
.pill { display: inline-flex; align-items: center; gap: 11px; color: #e8622c; border: 1.5px solid rgba(232, 98, 44, .5); border-radius: 999px; padding: 11px 18px; }
.pill i { width: 11px; height: 11px; border-radius: 50%; background: #e8622c; }
h1 { font: 400 232px/1 "Instrument Serif", serif; letter-spacing: -.015em; margin: 30px 0 0; display: flex; gap: .035em; white-space: nowrap; }
.tok { position: relative; padding: .02em .045em .06em; border-radius: .07em; background: color-mix(in srgb, var(--c) 19%, transparent); box-shadow: inset 0 -.035em 0 var(--c); }
.tok small { position: absolute; left: 2px; top: calc(100% + 12px); font: 500 19px/1 "JetBrains Mono", monospace; letter-spacing: .04em; color: var(--c); }
.line { margin: 60px 0 0; font: 400 47px/1.1 "Instrument Serif", serif; }
.line span { color: #e8622c; background: rgba(232, 98, 44, .16); border-radius: 5px; padding: 0 3px; }
.ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; background: #e8622c; color: #0d0d0c; font: 700 18px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; justify-content: center; }
</style>
</head>
<body>
  <div class="top"><span><b>&mdash;</b>joshowaaah.com</span><span class="pill"><i></i>100% AI-generated</span></div>
  <h1>
    <span class="tok" style="--c:#e8622c">Josh<small>p=.61</small></span><span class="tok" style="--c:#4a94ee">ow<small>p=.004</small></span><span class="tok" style="--c:#22ad7c">aaa<small>p=.0003</small></span><span class="tok" style="--c:#9d92f2">h<small>p=.97</small></span>
  </h1>
  <p class="line">Generated, not written <span>&mdash;</span> two prompts in, one page out.</p>
  <div class="ticker">&mdash; generated, not written &mdash; no humans consulted &mdash; made with AI and you can tell &mdash;</div>
</body>
</html>
